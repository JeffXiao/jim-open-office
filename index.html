<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jim Open Office</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f6f7f9; color: #1a1d21; }
  main { max-width: 720px; margin: 0 auto; padding: 72px 24px; }
  h1 { font-size: 32px; margin: 0 0 8px; }
  p.sub { font-size: 17px; color: #5b6470; margin: 0 0 40px; }
  .apps { display: grid; gap: 16px; }
  a.card { display: block; background: #fff; border: 1px solid #e2e5ea; border-radius: 12px; padding: 20px 24px; text-decoration: none; color: inherit; }
  a.card:hover { border-color: #9aa7b5; }
  a.card h2 { font-size: 19px; margin: 0 0 6px; }
  a.card p { margin: 0; color: #5b6470; font-size: 15px; }
  .card.soon { opacity: .6; }
  .card.soon h2 span { font-size: 13px; font-weight: 600; color: #8a6d00; background: #fdf3c4; border-radius: 6px; padding: 2px 8px; margin-left: 8px; vertical-align: 2px; }
  footer { margin-top: 48px; font-size: 13px; color: #8a939e; }
</style>
</head>
<body>
<main>
  <h1>Jim Open Office</h1>
  <p class="sub">A small open office suite. Pick an app to get started.</p>
  <div class="apps">
    <a class="card" href="/jim-open-office/open-sheet/">
      <h2>Open Sheet</h2>
      <p>Spreadsheet — edit cells, formulas, save and export to .xlsx.</p>
    </a>
    <div class="card soon">
      <h2>Open Word <span>coming soon</span></h2>
      <p>Word processor — not built yet.</p>
    </div>
  </div>
  <footer>Built with Univer (Apache-2.0). Source: github.com/JeffXiao/jim-open-office</footer>
</main>
</body>
</html>
